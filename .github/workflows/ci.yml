name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m hearthcore validate-roster
      - run: python -m hearthcore plan --character brannoc --snapshot examples/brannoc.json
      - run: python -m hearthcore replay --character brannoc --snapshot examples/brannoc.json

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testrootpassword
          MYSQL_DATABASE: acore_characters
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestrootpassword"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Load companion_* schema DDL
        run: mysql -h 127.0.0.1 -P 3306 -uroot -ptestrootpassword acore_characters < ops/sql/companion_schema.sql
      - name: Run MySQL integration tests
        env:
          HEARTHCORE_DB_HOST: 127.0.0.1
          HEARTHCORE_DB_PORT: "3306"
          HEARTHCORE_DB_NAME: acore_characters
          HEARTHCORE_DB_USER: root
          HEARTHCORE_DB_PASSWORD: testrootpassword
        run: python -m unittest tests/test_mysql_integration.py -v
